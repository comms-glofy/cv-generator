<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV Loader — Glofy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/comms-glofy/glofy-assets/refs/heads/main/favicon.png">

  <style>
    :root {
      --bg: #111113;
      --surface: #1a1a1c;
      --surface2: #222225;
      --border: rgba(255,255,255,.08);
      --border2: rgba(255,255,255,.14);
      --accent: #c8ff42;
      --accent-dim: rgba(200,255,66,.12);
      --text: #f0f0f0;
      --muted: #888;
      --danger: #ff5c5c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 22px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    header img { height: 28px; }

    header span {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .divider-v {
      width: 1px;
      height: 18px;
      background: var(--border2);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 48px 24px 80px;
    }

    .card {
      width: 100%;
      max-width: 700px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }

    .field label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .field input[type=text],
    .field select,
    .field textarea {
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 10px;
      padding: 11px 14px;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      color: var(--text);
      outline: none;
      transition: border-color .15s;
    }

    .field input[type=text]:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--accent);
    }

    .field select option { background: #222; }

    .field textarea {
      resize: vertical;
      min-height: 90px;
      line-height: 1.5;
    }

    /* Drop zone */
    .drop-zone {
      border: 1.5px dashed var(--border2);
      border-radius: 14px;
      padding: 36px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      position: relative;
    }

    .drop-zone:hover,
    .drop-zone.drag-over {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .drop-zone input[type=file] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-icon {
      font-size: 32px;
      margin-bottom: 10px;
      display: block;
    }

    .drop-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .drop-sub {
      font-size: 12px;
      color: var(--muted);
    }

    .file-pill {
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--accent-dim);
      border: 1px solid rgba(200,255,66,.25);
      border-radius: 10px;
      padding: 10px 14px;
      margin-top: 12px;
      font-size: 13px;
    }

    .file-pill .pill-name { font-weight: 700; flex: 1; }
    .file-pill .pill-remove {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 0;
    }
    .file-pill .pill-remove:hover { color: var(--danger); }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
      border-radius: 12px;
      padding: 13px 22px;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }

    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .4; cursor: default; }

    .btn-accent { background: var(--accent); color: #111; }
    .btn-ghost {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border2);
    }
    .btn-open {
      background: var(--accent);
      color: #111;
      font-size: 14px;
      padding: 15px 28px;
      border-radius: 14px;
      width: 100%;
      justify-content: center;
    }

    .actions-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Status / thinking */
    .thinking {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 16px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .dots span {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.2s infinite;
      margin-right: 3px;
    }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes pulse { 0%,80%,100%{opacity:.15} 40%{opacity:1} }

    .error-msg {
      display: none;
      background: rgba(255,92,92,.1);
      border: 1px solid rgba(255,92,92,.25);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--danger);
      margin-top: 14px;
    }

    /* Result fields */
    #resultCard { display: none; }

    .section-sep {
      height: 1px;
      background: var(--border);
      margin: 18px 0;
    }

    .open-section {
      display: none;
      width: 100%;
      max-width: 700px;
    }

    .open-note {
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px;
      text-align: center;
    }

    /* Progress bar */
    .progress-wrap {
      display: none;
      height: 3px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 14px;
    }
    .progress-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      width: 0%;
      transition: width .4s ease;
    }
  </style>
</head>
<body>

<header>
  <img src="https://raw.githubusercontent.com/comms-glofy/glofy-assets/refs/heads/main/favicon.png" alt="Glofy" />
  <div class="divider-v"></div>
  <span>CV Loader</span>
</header>

<main>

  <!-- Step 1: Input -->
  <div class="card" id="inputCard">
    <div class="card-title">01 — Datos del candidato</div>

    <div class="row2">
      <div class="field">
        <label>Idioma de salida</label>
        <select id="lang">
          <option value="es">Español</option>
          <option value="en">English</option>
        </select>
      </div>
      <div class="field">
        <label>País</label>
        <select id="country">
          <option value="">Seleccionar...</option>
          <option>Argentina</option>
          <option>Bolivia</option>
          <option>Brasil</option>
          <option>Chile</option>
          <option>Colombia</option>
          <option>Costa Rica</option>
          <option>Paraguay</option>
          <option>Puerto Rico</option>
          <option>República Dominicana</option>
          <option>Uruguay</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>CV — PDF del candidato</label>
      <div class="drop-zone" id="dropZone">
        <input type="file" id="cvFile" accept=".pdf,application/pdf" />
        <span class="drop-icon">📄</span>
        <div class="drop-label">Arrastrá el PDF acá o hacé click para subir</div>
        <div class="drop-sub">Solo archivos PDF</div>
      </div>
      <div class="file-pill" id="filePill">
        <span>📄</span>
        <span class="pill-name" id="pillName"></span>
        <button class="pill-remove" onclick="removeFile()" title="Quitar">×</button>
      </div>
    </div>

    <div class="field">
      <label>Informe de entrevista (opcional)</label>
      <textarea id="reportInput" placeholder="Pegá acá el informe de entrevista..."></textarea>
    </div>

    <div class="actions-row" style="margin-top:8px">
      <button class="btn btn-accent" id="processBtn" onclick="processCV()">
        ✦ Procesar con IA
      </button>
      <button class="btn btn-ghost" onclick="resetAll()">Limpiar</button>
    </div>

    <div class="thinking" id="thinking">
      <div class="dots"><span></span><span></span><span></span></div>
      <span id="thinkingMsg">Leyendo el PDF...</span>
    </div>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <!-- Step 2: Review -->
  <div class="card" id="resultCard">
    <div class="card-title">02 — Revisar y ajustar</div>

    <div class="row2">
      <div class="field">
        <label>Nombre completo</label>
        <input type="text" id="f_fullName" />
      </div>
      <div class="field">
        <label>Rol / Posición</label>
        <input type="text" id="f_role" />
      </div>
    </div>

    <div class="field">
      <label>About (resumen profesional)</label>
      <textarea id="f_about" style="min-height:100px"></textarea>
    </div>

    <div class="field">
      <label>Skills técnicas (una por línea, 5–7)</label>
      <textarea id="f_skills" style="min-height:90px"></textarea>
    </div>

    <div class="field">
      <label>Idiomas — formato: Idioma|Nivel &nbsp;·&nbsp; niveles: Intermediate / Advanced / Native</label>
      <textarea id="f_langs" style="min-height:66px" placeholder="Spanish|Native&#10;English|Advanced"></textarea>
    </div>

    <div class="section-sep"></div>

    <div class="field">
      <label>Experiencias — bloques separados por línea en blanco &nbsp;·&nbsp; orden: Título, Empresa, Fechas, Descripción</label>
      <textarea id="f_exps" style="min-height:160px"></textarea>
    </div>

    <div class="field">
      <label>Educación — bloques separados por línea en blanco &nbsp;·&nbsp; orden: Carrera, Institución, Fechas</label>
      <textarea id="f_edu" style="min-height:110px"></textarea>
    </div>

    <div class="section-sep"></div>

    <div class="field">
      <label>Informe de entrevista</label>
      <textarea id="f_report" style="min-height:120px"></textarea>
    </div>
  </div>

  <!-- Step 3: Open -->
  <div class="open-section" id="openSection">
    <button class="btn btn-open" onclick="openGenerator()">
      Abrir en CV Generator →
    </button>
    <p class="open-note">El formulario se va a abrir lleno y editable. La foto se sube a mano.</p>
  </div>

</main>

<script>
  const CV_GEN = 'https://comms-glofy.github.io/cv-generator/';
  let pdfBase64 = null;

  // ── Drag & drop ──────────────────────────────────────────────────────
  const dropZone = document.getElementById('dropZone');
  const cvFile   = document.getElementById('cvFile');

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  });

  cvFile.addEventListener('change', e => {
    if (e.target.files[0]) handleFile(e.target.files[0]);
  });

  function handleFile(file) {
    if (!file.type.includes('pdf') && !file.name.endsWith('.pdf')) {
      showError('Solo se aceptan archivos PDF.');
      return;
    }
    document.getElementById('pillName').textContent = file.name;
    document.getElementById('filePill').style.display = 'flex';

    const reader = new FileReader();
    reader.onload = () => { pdfBase64 = reader.result.split(',')[1]; };
    reader.readAsDataURL(file);
  }

  function removeFile() {
    pdfBase64 = null;
    cvFile.value = '';
    document.getElementById('filePill').style.display = 'none';
  }

  // ── Process ──────────────────────────────────────────────────────────
  async function processCV() {
    if (!pdfBase64) { showError('Subí el PDF del candidato primero.'); return; }

    const lang    = document.getElementById('lang').value;
    const country = document.getElementById('country').value;
    const report  = document.getElementById('reportInput').value.trim();

    setThinking(true, 'Leyendo el PDF...');
    setProgress(20);
    hideError();

    const langLabel = lang === 'es' ? 'español' : 'English';

    const systemPrompt = `Sos un extractor de datos de CV para Glofy, una empresa de tecnología.
Tu tarea es extraer información estructurada del CV y devolver ÚNICAMENTE un objeto JSON válido, sin markdown, sin explicaciones, sin texto extra.

Idioma de salida: ${langLabel}
País sugerido (si no está en el CV): ${country || 'desconocido'}

Estructura JSON requerida:
{
  "fullName": "string",
  "role": "string (rol principal del candidato)",
  "country": "string (uno de: Argentina, Bolivia, Brasil, Chile, Colombia, Costa Rica, Paraguay, Puerto Rico, República Dominicana, Uruguay — o string vacío)",
  "about": "string (resumen profesional de 70-120 palabras en ${langLabel})",
  "skills": "skill1\\nskill2\\nskill3\\nskill4\\nskill5 (5-7 skills, una por línea, sin bullets)",
  "languages": [{"language": "English|Spanish|Portuguese", "level": "Intermediate|Advanced|Native"}],
  "experiences": [{"rawText": "Título\\nEmpresa\\nFechas\\nResponsabilidad 1\\nResponsabilidad 2"}],
  "education": [{"rawText": "Carrera\\nInstitución\\nFechas"}],
  "report": "string (informe de entrevista si fue provisto, caso contrario string vacío)"
}`;

    const userContent = [
      {
        type: 'document',
        source: { type: 'base64', media_type: 'application/pdf', data: pdfBase64 }
      },
      {
        type: 'text',
        text: report
          ? `Extraé los datos del CV adjunto. Además, incluí este informe de entrevista en el campo "report":\n\n${report}`
          : 'Extraé todos los datos del CV adjunto.'
      }
    ];

    try {
      setThinking(true, 'Claude está procesando el CV...');
      setProgress(55);

      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          system: systemPrompt,
          messages: [{ role: 'user', content: userContent }]
        })
      });

      setProgress(80);

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `Error ${res.status}`);
      }

      const data = await res.json();
      const text = data.content.map(b => b.text || '').join('');
      const clean = text.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(clean);

      setProgress(100);
      setThinking(false);

      populate(parsed, country);
      document.getElementById('resultCard').style.display = 'block';
      document.getElementById('openSection').style.display = 'block';
      document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'start' });

    } catch(e) {
      setThinking(false);
      showError('Error al procesar: ' + e.message);
    }
  }

  function populate(d, countryFallback) {
    document.getElementById('f_fullName').value = d.fullName || '';
    document.getElementById('f_role').value     = d.role || '';
    document.getElementById('f_about').value    = d.about || '';
    document.getElementById('f_skills').value   = d.skills || '';
    document.getElementById('f_report').value   = d.report || document.getElementById('reportInput').value.trim();

    if (d.country) document.getElementById('country').value = d.country;
    else if (countryFallback) document.getElementById('country').value = countryFallback;

    const langsText = (d.languages || []).map(l => `${l.language}|${l.level}`).join('\n');
    document.getElementById('f_langs').value = langsText;

    const expsText = (d.experiences || []).map(e => e.rawText).join('\n\n');
    document.getElementById('f_exps').value = expsText;

    const eduText = (d.education || []).map(e => e.rawText).join('\n\n');
    document.getElementById('f_edu').value = eduText;
  }

  // ── Open generator ───────────────────────────────────────────────────
  function openGenerator() {
    const lang    = document.getElementById('lang').value;
    const country = document.getElementById('country').value;
    const params  = new URLSearchParams();

    params.set('lang',       lang);
    params.set('fullName',   document.getElementById('f_fullName').value);
    params.set('role',       document.getElementById('f_role').value);
    if (country) params.set('country', country);
    params.set('about',      document.getElementById('f_about').value);
    params.set('skills',     document.getElementById('f_skills').value);
    params.set('reportText', document.getElementById('f_report').value);

    document.getElementById('f_langs').value.trim().split('\n').filter(Boolean).forEach((l, i) => {
      params.set(`lang${i}`, l.trim());
    });

    document.getElementById('f_exps').value.trim().split(/\n\n+/).filter(Boolean).forEach((b, i) => {
      params.set(`exp${i}`, b.trim());
    });

    document.getElementById('f_edu').value.trim().split(/\n\n+/).filter(Boolean).forEach((b, i) => {
      params.set(`edu${i}`, b.trim());
    });

    window.open(CV_GEN + '?' + params.toString(), '_blank');
  }

  // ── Helpers ──────────────────────────────────────────────────────────
  function setThinking(on, msg) {
    const el = document.getElementById('thinking');
    el.style.display = on ? 'flex' : 'none';
    if (msg) document.getElementById('thinkingMsg').textContent = msg;
    document.getElementById('processBtn').disabled = on;
  }

  function setProgress(pct) {
    document.getElementById('progressWrap').style.display = 'block';
    document.getElementById('progressBar').style.width = pct + '%';
    if (pct >= 100) setTimeout(() => { document.getElementById('progressWrap').style.display = 'none'; }, 800);
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function hideError() {
    document.getElementById('errorMsg').style.display = 'none';
  }

  function resetAll() {
    removeFile();
    document.getElementById('reportInput').value = '';
    document.getElementById('lang').value = 'es';
    document.getElementById('country').value = '';
    document.getElementById('resultCard').style.display = 'none';
    document.getElementById('openSection').style.display = 'none';
    hideError();
    setThinking(false);
  }
</script>

</body>
</html>
